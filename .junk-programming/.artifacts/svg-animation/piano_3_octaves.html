<script>
(() => {
  const notes = ['C4', 'C#4', 'D4', 'D#4', 'E4', 'F4', 'F#4', 'G4', 'G#4', 'A4', 'A#4', 'B4'];
  const intervalMs = 420;
  let timer = null;
  let index = 0;
  const status = document.getElementById('status');
  const keys = [...document.querySelectorAll('.key-group')];
  const clear = () => keys.forEach(k => k.classList.remove('pressed'));
  function stop() {
    if (timer !== null) clearInterval(timer);
    timer = null;
    clear();
    status.textContent = 'Stopped · C4–B4';
  }
  function step() {
    clear();
    if (index >= notes.length) {
      clearInterval(timer); timer = null;
      status.textContent = 'Complete · 12 notes played';
      return;
    }
    const note = notes[index++];
    const key = document.getElementById('key-' + note.replace('#', 's'));
    if (key) key.classList.add('pressed');
    status.textContent = 'Pressing ' + note + ' · ' + index + '/12';
  }
  document.getElementById('play').addEventListener('click', () => {
    if (timer !== null) clearInterval(timer);
    clear(); index = 0; step();
    timer = setInterval(step, intervalMs);
  });
  document.getElementById('stop').addEventListener('click', stop);
  // Start one pass automatically, so the middle octave is demonstrated immediately.
  window.addEventListener('DOMContentLoaded', () => {
    index = 0; step(); timer = setInterval(step, intervalMs);
  });
})();
</script>
